<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Jood bil-Mawjood - الجود بالموجود</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#FFFBF5;color:#1C1917;padding-bottom:90px}
.top{background:#fff;padding:20px 16px 12px;text-align:center;border-bottom:1px solid #FDE68A}
.top h1{margin:0;font-size:21px} .top h1 span{color:#EA580C}
.top p{margin:6px 0;color:#78716C;font-size:13px}
.search{display:flex;gap:8px;padding:14px;background:#fff;position:sticky;top:0;z-index:10}
.search input{flex:1;padding:14px;border-radius:12px;border:1px solid #E7E5E4;font-size:15px}
.search button{background:#EA580C;color:#fff;border:0;padding:0 20px;border-radius:12px;font-weight:700}
.wrap{padding:14px} .sec{font-weight:800;margin:14px 0 8px;font-size:17px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{padding:9px 16px;border-radius:20px;border:1px solid #E7E5E4;background:#fff;font-weight:700}
.filters button.active{background:#EA580C;color:#fff;border-color:#EA580C}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.item{background:#fff;border:2px solid #F5F5F4;border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.item.active{border-color:#EA580C;background:#FFF7ED}
.item .qty{background:#F97316;color:#fff;font-size:11px;padding:2px 7px;border-radius:20px}
.item b{display:block;margin-top:6px;font-size:13px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #F5F5F4}
.card h3{margin:0 0 6px} .tag{color:#EA580C;font-size:12px;font-weight:700}
.match{font-weight:800;color:#16A34A}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;border-top:1px solid #eee;display:flex;gap:10px}
.bar button{flex:1;padding:15px;border-radius:12px;border:0;font-weight:800;font-size:15px}
.bar .sug{background:#EA580C;color:#fff}
</style>
</head>
<body>
<div class="top"><h1><span>Al-Jood bil-Mawjood</span> - الجود بالموجود</h1><p>Iraqi + World Recipes • وصفات عراقية وعالمية بمكوناتك</p></div>
<div class="search"><input id="q" oninput="render()" placeholder="Search ingredients, recipe, or dish..."><button onclick="render()">Search</button></div>
<div class="wrap">
<div class="sec">شنو عندك بالبيت؟</div>
<div class="grid" id="ings"></div>
<div class="sec">وصفات مقترحة - مرتبة حسب مكوناتك</div>
<div class="filters">
<button class="active" onclick="setF('الكل',this)">الكل</button>
<button onclick="setF('عراقي',this)">عراقي 🇮🇶</button>
<button onclick="setF('عالمي',this)">عالمي 🌍</button>
<button onclick="setF('حلويات',this)">حلويات 🍰</button>
</div>
<div id="recipes" style="margin-top:12px"></div>
</div>
<div class="bar"><button id="count">0 Selected</button><button class="sug" onclick="suggest()">اقتراح وصفة / Suggest Recipe</button></div>
<script>
let ings=[["طماطم","1 pc","🍅"],["بصل","2 pcs","🧅"],["بيض","3 pcs","🥚"],["رز","1 cup","🍚"],["دجاج","500g","🍗"],["لحم مثروم","300g","🥩"],["لحم قطع","500g","🥩"],["بتيتة","2 pcs","🥔"],["ثوم","3 cloves","🧄"],["معدنوس","1 bunch","🌿"],["خبز تنور","2 pcs","🫓"],["حمص","1 cup","🫘"],["معكرونة","500g","🍝"],["جبن موزاريلا","200g","🧀"],["حليب","1 cup","🥛"],["طحين","2 cup","🌾"],["زيت زيتون","2 tbsp","🫒"],["فلفل","1 pc","🫑"],["جزر","2 pcs","🥕"],["ذرة","1 cup","🌽"],["فاصوليا","1 cup","🫛"],["عدس","1 cup","🍲"],["شوفان","1 cup","🥣"],["موز","2 pcs","🍌"],["تفاح","2 pcs","🍎"],["شوكولاتة","100g","🍫"],["سكر","1 cup","🧂"],["زبدة","100g","🧈"],["كريمة","1 cup","🍶"],["صلصة طماطم","1 cup","🥫"],["صويا صوص","2 tbsp","🍶"],["زنجبيل","1 pc","🫚"],["ليمون","1 pc","🍋"],["خيار","2 pcs","🥒"],["سبانخ","1 bunch","🥬"],["فطر","200g","🍄"],["روبيان","300g","🍤"],["تونة","1 علبة","🐟"],["خبز تورتيلا","4 pcs","🌮"],["خبز برغر","4 pcs","🍔"],["أفوكادو","1 pc","🥑"],["عسل","2 tbsp","🍯"],["قرفة","1 tsp","✨"],["كمون","1 tsp","✨"],["كركم","1 tsp","✨"]];
let sel=new Set(); let curF="الكل";
let recipes=[
{n:"تشريب لحم موصلي",c:"عراقي",need:["لحم قطع","خبز تنور","حمص","بصل"],d:"500g لحم قطع، 2 خبز تنور، 1 كوب حمص، 2 بصل، 2 نومي بصرة - نسلق اللحم مع البصل والنومي، نضيف الحمص، نصب فوق الخبز."},
{n:"كبة عروك",c:"عراقي",need:["لحم مثروم","بتيتة","معدنوس","بصل"],d:"300g لحم مثروم، 2 بتيتة مبروشة، معدنوس، بصل - نخلط ونعجن ونشكل اقراص ونقلي."},
{n:"دولمة موصلية",c:"عراقي",need:["رز","لحم مثروم","طماطم","بصل"],d:"ورق عنب، تمن، لحم مثروم، خضرة - تحشى وتصفط بالجدر وتطبخ على نار هادية."},
{n:"برياني دجاج",c:"عراقي",need:["دجاج","رز","بتيتة","بصل"],d:"دجاج، رز، بتيتة، بصل، بهارات برياني - نسلق الدجاج، نطبخ الرز، نصفط طبقات ونبخر."},
{n:"معكرونة بالصلصة الإيطالية",c:"عالمي",need:["معكرونة","صلصة طماطم","ثوم","زيت زيتون","جبن موزاريلا"],d:"500g معكرونة، صلصة طماطم، ثوم، زيت زيتون، جبن موزاريلا - نسلق المعكرونة، نحمس الثوم بالزيت، نضيف الصلصة، نخلط ونرش جبن."},
{n:"بيتزا مارغريتا",c:"عالمي",need:["طحين","طماطم","جبن موزاريلا","زيت زيتون"],d:"طحين، طماطم، جبن موزاريلا، زيت زيتون - نعجن العجينة، نفردها، نضيف صلصة وجبن، نشوي 15 دقيقة."},
{n:"شاورما دجاج تركية",c:"عالمي",need:["دجاج","خبز تورتيلا","ثوم","ليمون"],d:"500g دجاج، خبز تورتيلا، ثوم، ليمون - نتبل الدجاج، نشوي، نقطع، نلف بالخبز مع صلصة ثوم."},
{n:"تاكو مكسيكي",c:"عالمي",need:["لحم مثروم","خبز تورتيلا","طماطم","بصل","أفوكادو"],d:"300g لحم مثروم، خبز تورتيلا، طماطم، بصل، أفوكادو - نحمس اللحم، نحشي التورتيلا، نضيف خضرة."},
{n:"كاري دجاج هندي",c:"عالمي",need:["دجاج","بصل","ثوم","زنجبيل","كركم","كريمة"],d:"500g دجاج، بصل، ثوم، زنجبيل، كركم، كمون، كريمة - نحمس البصل والبهارات، نضيف الدجاج والكريمة."},
{n:"رز مقلي آسيوي",c:"عالمي",need:["رز","بيض","صويا صوص","جزر"],d:"رز، بيض، صويا صوص، خضرة، جزر - نقلي الرز مع البيض والخضرة، نضيف صويا صوص."},
{n:"برغر كلاسيك",c:"عالمي",need:["لحم مثروم","خبز برغر","جبن موزاريلا","طماطم"],d:"300g لحم مثروم، خبز برغر، جبن، طماطم، بصل - نشكل اللحم اقراص، نشوي، نحشي الخبز."},
{n:"بان كيك بالموز",c:"حلويات",need:["طحين","بيض","حليب","موز","سكر"],d:"طحين، بيض، حليب، موز، سكر، زبدة - نخلط، نقلي بمقلاة، نضيف عسل وموز."},
{n:"كيكة شوكولاتة",c:"حلويات",need:["طحين","بيض","سكر","شوكولاتة","زبدة"],d:"طحين، بيض، سكر، شوكولاتة، زبدة، حليب - نخلط، نخبز 30 دقيقة على 180."},
{n:"أومليت بالجبن",c:"عالمي",need:["بيض","جبن موزاريلا","طماطم"],d:"3 بيض، جبن موزاريلا، طماطم، زبدة - نخفق البيض، نقلي، نضيف جبن."}
];
function getSelNames(){return [...sel].map(i=>ings[i][0])}
function score(r){let s=getSelNames();let have=r.need.filter(n=>s.includes(n)).length;return {have,total:r.need.length,pct:Math.round(have/r.need.length*100),missing:r.need.filter(n=>!s.includes(n))}}
function setF(f,btn){curF=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function toggle(i){sel.has(i)?sel.delete(i):sel.add(i);render()}
function render(){
let q=(document.getElementById("q").value||"").toLowerCase();
document.getElementById("ings").innerHTML=ings.map((x,i)=>`<div class="item ${sel.has(i)?"active":""}" onclick="toggle(${i})"><span class="qty">${x[1]}</span><div style="font-size:28px">${x[2]}</div><b>${x[0]}</b></div>`).join("");
let list=recipes.map(r=>({...r,...score(r)})).sort((a,b)=>b.pct-a.pct).filter(r=>(curF==="الكل"||r.c===curF)&&(r.n.includes(q)||r.d.includes(q)||q===""));
document.getElementById("recipes").innerHTML=list.map(r=>`<div class="card"><span class="tag">${r.c} • ${r.pct}% مطابق</span><h3>${r.n}</h3><p class="match">عندك ${r.have} من ${r.total} مكونات ${r.missing.length? "• ناقصك: "+r.missing.join("، "):"• كاملة! تكدر تطبخها هسه"}</p><p>${r.d}</p></div>`).join("")||"<p>ما لقينا وصفة</p>";
document.getElementById("count").innerText=sel.size+" مكونات مختارة • "+sel.size+" Selected";
}
function suggest(){
if(sel.size===0){alert("اختار مكونات أولاً!");return}
let best=[...recipes].map(r=>({...r,...score(r)})).sort((a,b)=>b.pct-a.pct).slice(0,3);
alert("أفضل 3 وصفات لمكوناتك:\n\n1. "+best[0].n+" - "+best[0].pct+"% مطابق\n2. "+best[1].n+" - "+best[1].pct+"% مطابق\n3. "+best[2].n+" - "+best[2].pct+"% مطابق\n\nشوف التفاصيل بالصفحة!");
window.scrollTo(0,600);
}
render();
</script>
</body>
</html>
