function score(r){let s=getSelNames();let have=r.need.filter(n=>s.includes(n)).length;return {have,total:r.need.length,pct:Math.round(have/r.need.length*100),missing:r.need.filter(n=>!s.includes(n))}}
function setF(f,btn){curF=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render()}
function toggle(i){sel.has(i)?sel.delete(i):sel.add(i);render()}
function render(){
let q=(document.getElementById("q").value||"").toLowerCase();
document.getElementById("ings").innerHTML=ings.map((x,i)=>`<div class="item ${sel.has(i)?"active":""}" onclick="toggle(${i})"><span class="qty">${x[1]}</span><div style="font-size:28px">${x[2]}</div><b>${x[0]}</b></div>`).join("");
let list=recipes.map((r,idx)=>({...r,idx,...score(r)})).sort((a,b)=>b.pct-a.pct).filter(r=>(curF==="الكل"||r.c===curF)&&(r.n.includes(q)||q===""));
document.getElementById("recipes").innerHTML=list.map(r=>`<div class="card" onclick="openRecipe(${r.idx})"><span class="tag">${r.c} • ${r.emoji} • ${r.pct}% مطابق</span><h3>${r.n}</h3><p class="match">عندك ${r.have} من ${r.total} مكونات ${r.missing.length? "• ناقصك: "+r.missing.join("، "):"• كاملة!"}</p><div class="open">اضغط هنا لتشوف الوصفة كاملة 👆</div></div>`).join("")||"<p>ما لقينا وصفة</p>";
document.getElementById("count").innerText=sel.size+" مكونات مختارة • "+sel.size+" Selected";
}
function openRecipe(idx){
let r=recipes[idx]; let s=score(r);
document.getElementById("modalContent").innerHTML=`<div style="font-size:50px;text-align:center">${r.emoji}</div><h2>${r.n}</h2><p><span class="badge">${r.c}</span> <span class="badge">⏱ ${r.time}</span> <span class="badge">🔥 ${r.cal}</span></p><p><b>المكونات المطلوبة:</b><br>${r.need.map(n=>getSelNames().includes(n)?"✅ "+n:"❌ "+n+" - ما عندك").join("<br>")}</p><p><b>طريقة التحضير:</b></p>${r.steps.map((st,i)=>`<div class="step"><b>خطوة ${i+1}:</b> ${st}</div>`).join("")}<p style="text-align:center;color:#16A34A;font-weight:800">${s.missing.length? "ناقصك: "+s.missing.join("، "):"عندك كل المكونات! تكدر تطبخها هسه 🎉"}</p>`;
document.getElementById("modal").style.display="block";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function suggest(){
if(sel.size===0){alert("اختار مكونات أولاً!");return}
let best=[...recipes].map((r,idx)=>({...r,idx,...score(r)})).sort((a,b)=>b.pct-a.pct).slice(0,3);
openRecipe(best[0].idx);
}
render();
</script>
</body>
</html>
